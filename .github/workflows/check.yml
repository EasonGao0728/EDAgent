name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python examples/placement_metrics.py
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m unittest discover -s tests -p test_catalog_qualification.py -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm --prefix ic-workbench run check
