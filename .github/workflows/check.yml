name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python examples/placement_metrics.py
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m unittest discover -s tests -p test_catalog_qualification.py -v
      - run: python -m unittest discover -s tests -p test_case_admission_budget.py -v
      - run: python -m unittest discover -s tests -p test_planning_budget.py -v
      - run: python -m unittest discover -s tests -p test_dsh_model_selection.py -v
      - run: python -m unittest discover -s tests -p test_buffer_output_pin.py -v
      - run: python -m unittest discover -s tests -p test_def_io_compat.py -v
      - run: python -m unittest discover -s tests -p test_chatgpt.py -k ProtocolTests -v
      - run: node --test dsh/model-recovery.test.mjs dsh/catalog-read-error.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm --prefix ic-workbench run check

  windows-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start the Windows workbench and verify its session interface
        shell: powershell
        run: ./tests/test-windows-workbench.ps1
