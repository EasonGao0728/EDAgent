[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aieda-macro-agent"
version = "0.1.0"
description = "Evidence-driven design perception and executable macro-placement operator synthesis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
macro-agent = "macro_agent.cli:main"

[tool.setuptools.packages.find]
include = ["macro_agent*"]
